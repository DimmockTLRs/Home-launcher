name: Build
on:
  push:

  pull_request:
    branches:
      - master
    paths-ignore:
      [
        "**/**.md"
      ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - name: Checkout Home-launcher
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          # vcpkg 2026.10.16 uses the maintained getopt-win32 source.
          ref: 9eec002df1cd109f8f104cd966a763daf9751489
          path: vcpkg

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -D "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -D VCPKG_TARGET_TRIPLET=x64-windows-static `
            -D CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build and package
        run: cmake --build build --target package --config Release

      - name: Verify and stage Windows package
        id: windows_package
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build -Filter '*.zip' -File)
          if ($archives.Count -ne 1) {
            throw "Expected one CPack ZIP, found $($archives.Count)."
          }

          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath windows-package
          $executables = @(Get-ChildItem windows-package -Filter 'flex-launcher.exe' -File -Recurse)
          if ($executables.Count -ne 1) {
            throw "Expected one flex-launcher.exe, found $($executables.Count)."
          }

          $package = $executables[0].DirectoryName
          $requiredFiles = @(
            'config.ini',
            'assets/fonts/OpenSans-Regular.ttf',
            'assets/fonts/SourceSansPro-Regular.ttf',
            'assets/icons/kodi.png'
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $file) -PathType Leaf)) {
              throw "Windows package is missing $file."
            }
          }
          "path=$package" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        name: Upload Windows ZIP artifact
        with:
          name: flex-launcher-windows-x64
          path: ${{ steps.windows_package.outputs.path }}
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.zip
